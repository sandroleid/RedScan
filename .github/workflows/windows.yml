name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['windows-v*']
  pull_request:
    paths: ['windows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Core-Logik auf echtem Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: .NET einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Wiederherstellen
        run: dotnet restore windows/src/RedScan.Tests/RedScan.Tests.csproj
      - name: Bauen
        run: dotnet build windows/src/RedScan.Tests/RedScan.Tests.csproj -c Release --no-restore
      - name: Tests ausführen
        run: dotnet test windows/src/RedScan.Tests/RedScan.Tests.csproj -c Release --no-build --logger "console;verbosity=detailed"

  app:
    name: WinUI-App bauen
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: .NET einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: MSBuild (Visual Studio) einrichten
        uses: microsoft/setup-msbuild@v2
      - name: Wiederherstellen
        run: msbuild windows/src/RedScan.App/RedScan.App.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true
      - name: App veröffentlichen (unverpackt, self-contained)
        run: msbuild windows/src/RedScan.App/RedScan.App.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true /p:WindowsPackageType=None /p:PublishDir=${{ github.workspace }}\publish\
      - name: Ausgabeordner packen
        id: pack
        shell: pwsh
        run: |
          $dir = "publish"
          if (!(Test-Path "$dir/RedScan.exe")) { Write-Error "RedScan.exe nicht gefunden in $dir"; Get-ChildItem $dir -ErrorAction SilentlyContinue; exit 1 }
          Write-Host "PRI-Dateien:"; Get-ChildItem $dir -Filter *.pri | Select-Object Name,Length | Format-Table
          if (!(Test-Path "$dir/RedScan.pri") -and !(Test-Path "$dir/resources.pri")) {
            Write-Error "Die App-Ressourcen (RedScan.pri/resources.pri) fehlen – die App würde nicht starten."; exit 1
          }
          if (!(Test-Path "$dir/Assets/RedScan.ico")) { Write-Error "Icon-Datei Assets/RedScan.ico fehlt im Paket."; exit 1 }
          $zip = "RedScan-Windows.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Version ermitteln
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content windows/src/RedScan.App/RedScan.App.csproj
          $v = ($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1).Trim()
          if (-not $v) { Write-Error "<Version> fehlt in RedScan.App.csproj"; exit 1 }
          Write-Host "App-Version: $v"
          if ("${{ github.ref }}" -like "refs/tags/windows-v*") {
            $tagVersion = "${{ github.ref_name }}".Substring("windows-v".Length)
            if ($tagVersion -ne $v) { Write-Error "Tag windows-v$tagVersion passt nicht zur Version $v in RedScan.App.csproj."; exit 1 }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Installer bauen (Inno Setup)
        id: setup
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress | Out-Host
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe (Inno Setup) nicht gefunden."; exit 1 }
          Write-Host "Inno Setup: $($iscc.FullName) ($($iscc.VersionInfo.ProductVersion))"
          $v = "${{ steps.version.outputs.version }}"
          & $iscc.FullName "/DAppVersion=$v" "/DPublishDir=$PWD\publish" "/O$PWD\dist" windows\installer\RedScan.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC ist fehlgeschlagen ($LASTEXITCODE)."; exit 1 }
          $exe = "dist\RedScan-Setup-$v.exe"
          if (!(Test-Path $exe)) { Write-Error "$exe wurde nicht erzeugt."; exit 1 }
          Write-Host ("Installer: {0} ({1:N1} MB)" -f $exe, ((Get-Item $exe).Length / 1MB))
          "exe=$exe" >> $env:GITHUB_OUTPUT
      - name: Starttest (App dunkel + hell starten, scannen, Screenshots)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms, UIAutomationClient, UIAutomationTypes
          Add-Type -Namespace W32 -Name Win -MemberDefinition '[DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int ht, bool r);'
          $start = Get-Date
          # Icon der EXE extrahieren (zeigt, ob das Programm-Icon eingebettet ist)
          $exeIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path "publish\RedScan.exe"))
          $exeIcon.ToBitmap().Save("smoke\exe-icon.png")
          Write-Host "EXE-Icon extrahiert ($($exeIcon.Width)x$($exeIcon.Height))"
          # Nur das eigene /24 des Runners scannen (Cloud-Netze sind riesig)
          $ip = (Get-NetIPConfiguration | Where-Object { $_.IPv4DefaultGateway } | Select-Object -First 1).IPv4Address.IPAddress
          $target = ($ip -replace '\.\d+$', '.0') + '/24'
          Write-Host "Runner-IP: $ip  ->  Ziel: $target"
          $log = Join-Path $env:LOCALAPPDATA "RedScan\startup.log"
          $settings = Join-Path $env:LOCALAPPDATA "RedScan\settings.json"
          Remove-Item $settings -ErrorAction SilentlyContinue

          function Save-Screen([string]$name) {
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("smoke\$name"); Write-Host "Screenshot erstellt: $name"
            } catch { Write-Host "Screenshot nicht möglich ($name): $_" }
          }
          function Get-AppWindow($p) {
            for ($k = 0; $k -lt 20; $k++) {
              $p.Refresh()
              if ($p.MainWindowHandle -ne [IntPtr]::Zero) { return [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle) }
              Start-Sleep -Milliseconds 500
            }
            throw "Kein Hauptfenster gefunden"
          }
          function Find-Element($root, [string]$name, $type) {
            $c1 = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::NameProperty, $name)
            $c2 = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ControlTypeProperty, $type)
            $c = [System.Windows.Automation.AndCondition]::new([System.Windows.Automation.Condition[]]@($c1, $c2))
            $e = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
            if (-not $e) { throw "Element '$name' nicht gefunden" }
            return $e
          }
          function Invoke-AppButton($win, [string]$name) {
            $btn = Find-Element $win $name ([System.Windows.Automation.ControlType]::Button)
            $btn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          }
          function Show-Details($p, $win) {
            # Fenster an den Bildschirm anpassen und erstes Gerät öffnen (Detailansicht sichtbar)
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
            [W32.Win]::MoveWindow($p.MainWindowHandle, 0, 0, $b.Width, $b.Height, $true) | Out-Null
            Start-Sleep -Seconds 1
            $c = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::IsSelectionItemPatternAvailableProperty, $true)
            $item = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
            if ($item) { $item.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select() } else { Write-Host "Kein Gerät zum Auswählen gefunden" }
          }
          function Scroll-SidebarEnd($win) {
            # Seitenleiste ganz nach unten scrollen, damit der DARSTELLUNG-Umschalter sichtbar ist
            $e = Find-Element $win "Hell" ([System.Windows.Automation.ControlType]::Button)
            $walker = [System.Windows.Automation.TreeWalker]::ControlViewWalker
            while ($e -and -not $e.GetCurrentPropertyValue([System.Windows.Automation.AutomationElement]::IsScrollPatternAvailableProperty)) { $e = $walker.GetParent($e) }
            if (-not $e) { throw "Seitenleiste nicht scrollbar" }
            $e.GetCurrentPattern([System.Windows.Automation.ScrollPattern]::Pattern).SetScrollPercent([System.Windows.Automation.ScrollPattern]::NoScroll, 100)
          }
          function Test-Log([string]$theme) {
            Write-Host "===== startup.log ($theme) ====="
            if (-not (Test-Path $log)) { Write-Error "Kein Log ($theme) – App kam nicht bis zum Konstruktor"; exit 1 }
            Copy-Item $log "smoke\startup-$theme.log"; Get-Content $log
            $problems = Select-String -Path $log -Pattern "FEHLER|Unbeobachtete" -SimpleMatch:$false
            Write-Host "Loggröße: $((Get-Item $log).Length) Bytes, Problemeinträge: $($problems.Count)"
            if ($problems.Count -gt 0) { $problems | Select-Object -First 5 | ForEach-Object { $_.Line }; Write-Error "Fehler im Startprotokoll ($theme)."; exit 1 }
            if (-not (Select-String -Path $log -Pattern "Fenster-Icon gesetzt" -Quiet)) { Write-Error "Fenster-Icon wurde nicht gesetzt ($theme)."; exit 1 }
            if (-not (Select-String -Path $log -Pattern "Titelleiste angepasst" -Quiet)) { Write-Error "Dunkle Titelleiste wurde nicht gesetzt ($theme)."; exit 1 }
          }
          function Start-ThemeRun([string]$theme) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $dump = Join-Path $PWD "smoke\scan-$theme.json"
            $p = Start-Process -FilePath "publish\RedScan.exe" -ArgumentList "--theme",$theme,"--autoscan","--target",$target,"--dump","`"$dump`"","--no-dialogs" -PassThru
            $null = $p.Handle
            $alive = $true
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 2
              if ($p.HasExited) { $alive = $false; break }
              if ($i -eq 7) { Save-Screen "screenshot-start-$theme.png" }
              if (Test-Path $dump) { break }
            }
            if ($alive -and (Test-Path $dump)) { Start-Sleep -Seconds 1; Save-Screen "screenshot-ende-$theme.png" }
            if (-not $alive) {
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $start } -ErrorAction SilentlyContinue |
                Where-Object { $_.Level -le 2 } | Format-List TimeCreated, ProviderName, Id, Message | Out-String -Width 300 | Tee-Object smoke\events.txt
              if (Test-Path $log) { Get-Content $log }
              Write-Error ("App ($theme) hat sich beendet. ExitCode: 0x{0:X8}" -f $p.ExitCode); exit 1
            }
            if (-not (Test-Path $dump)) { if (Test-Path $log) { Get-Content $log }; Stop-Process $p -Force; Write-Error "Scan ($theme) wurde nicht innerhalb von 4 Minuten fertig."; exit 1 }
            $devices = Get-Content $dump -Raw | ConvertFrom-Json
            Write-Host "===== Scan-Ergebnis ($theme): $($devices.Count) Geräte ====="
            $devices | Select-Object Ip, Mac, Vendor, Kind, @{n='Ports';e={($_.OpenPorts | ForEach-Object Port) -join ' '}} | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            if ($devices.Count -gt 60) { Write-Error "Unplausibel viele Geräte ($($devices.Count)) – Proxy-ARP wird nicht gefiltert."; exit 1 }
            return $p
          }
          function Stop-ThemeRun($p, [string]$theme) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Write-Error "App ($theme) ist nach dem Scan abgestürzt."; exit 1 }
            Stop-Process $p -Force
            Start-Sleep -Seconds 1
            Test-Log $theme
          }

          # ---- 1) Hell (--theme light): darf den gespeicherten Wert NICHT ändern ----
          $p = Start-ThemeRun "light"
          $win = Get-AppWindow $p
          Show-Details $p $win; Start-Sleep -Seconds 2; Save-Screen "screenshot-light.png"
          Scroll-SidebarEnd $win; Start-Sleep -Seconds 1; Save-Screen "screenshot-light-unten.png"
          Stop-ThemeRun $p "light"
          if (-not (Select-String -Path $log -Pattern "Darstellung: hell \(Kommandozeile\)" -Quiet)) { Write-Error "--theme light wurde nicht übernommen."; exit 1 }
          if (Test-Path $settings) { Get-Content $settings; Write-Error "--theme hat settings.json verändert."; exit 1 }

          # ---- 2) Dunkel (--theme dark) + Live-Umschalten auf Hell ----
          $p = Start-ThemeRun "dark"
          Copy-Item "smoke\screenshot-ende-dark.png" "smoke\screenshot-ende.png"
          $win = Get-AppWindow $p
          Show-Details $p $win; Start-Sleep -Seconds 2; Save-Screen "screenshot-dark.png"
          Scroll-SidebarEnd $win; Start-Sleep -Seconds 1; Save-Screen "screenshot-dark-unten.png"
          Invoke-AppButton $win "Hell"; Start-Sleep -Seconds 2; Save-Screen "screenshot-umgeschaltet-hell.png"
          Stop-ThemeRun $p "dark"
          if (-not (Select-String -Path $log -Pattern "Darstellung: dunkel \(Kommandozeile\)" -Quiet)) { Write-Error "--theme dark wurde nicht übernommen."; exit 1 }
          if (-not (Select-String -Path $log -Pattern "Darstellung gewechselt: hell" -Quiet)) { Write-Error "Umschalten auf Hell hat nicht funktioniert."; exit 1 }
          if (-not (Test-Path $settings)) { Write-Error "settings.json wurde beim Umschalten nicht gespeichert."; exit 1 }
          $saved = Get-Content $settings -Raw | ConvertFrom-Json
          Write-Host "settings.json: $(Get-Content $settings -Raw)"
          if ($saved.theme -ne "light") { Write-Error "settings.json enthält nicht theme=light."; exit 1 }

          # ---- 3) Neustart ohne --theme: gespeicherte Wahl (Hell) wird wiederhergestellt ----
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "publish\RedScan.exe" -ArgumentList "--no-dialogs" -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "App (gespeichert) hat sich beendet."; exit 1 }
          $win = Get-AppWindow $p
          Save-Screen "screenshot-gespeichert-hell.png"
          Invoke-AppButton $win "Dunkel"; Start-Sleep -Seconds 2
          Save-Screen "screenshot-zurueck-dunkel.png"
          Stop-ThemeRun $p "gespeichert"
          if (-not (Select-String -Path $log -Pattern "Darstellung: hell$" -Quiet)) { Write-Error "Gespeicherte Darstellung (hell) wurde nicht wiederhergestellt."; exit 1 }
          if ((Get-Content $settings -Raw | ConvertFrom-Json).theme -ne "dark") { Write-Error "Zurückschalten auf Dunkel wurde nicht gespeichert."; exit 1 }

          Write-Host "===== Windows-Ereignisprotokoll (Fehler) ====="
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $start } -ErrorAction SilentlyContinue |
            Where-Object { $_.Level -le 2 } | Format-List TimeCreated, ProviderName, Id, Message | Out-String -Width 300 | Tee-Object smoke\events.txt
          Write-Host "Starttest bestanden: App läuft und hat gescannt (dunkel + hell), Umschalten und Speichern funktionieren."
      - name: Installertest (installieren, starten, Update, deinstallieren)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $v = "${{ steps.version.outputs.version }}"
          $setup = Resolve-Path "${{ steps.setup.outputs.exe }}"
          $dir = Join-Path $env:ProgramFiles "RedScan"
          $exe = Join-Path $dir "RedScan.exe"
          $regKey = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{1BF47354-12B0-4814-89C4-9CE9EF0FD3A6}_is1"
          $startLnk = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\RedScan.lnk"
          $deskLnk = Join-Path $env:PUBLIC "Desktop\RedScan.lnk"
          $log = Join-Path $env:LOCALAPPDATA "RedScan\startup.log"

          function Invoke-Setup([string]$logName) {
            $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon","/LOG=`"$PWD\smoke\$logName`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content "smoke\$logName" -ErrorAction SilentlyContinue; Write-Error "Setup ($logName) ExitCode $($p.ExitCode)"; exit 1 }
          }
          function Test-Installed([string]$step) {
            foreach ($f in @($exe, (Join-Path $dir "Assets\RedScan.ico"), (Join-Path $dir "unins000.exe"), $startLnk, $deskLnk)) {
              if (!(Test-Path $f)) { Write-Error "[$step] fehlt: $f"; exit 1 }
            }
            if (!(Test-Path (Join-Path $dir "RedScan.pri")) -and !(Test-Path (Join-Path $dir "resources.pri"))) { Write-Error "[$step] PRI-Datei fehlt."; exit 1 }
            $reg = Get-ItemProperty $regKey -ErrorAction SilentlyContinue
            if (-not $reg) { Write-Error "[$step] Kein Eintrag unter Apps & Features ($regKey)."; exit 1 }
            Write-Host "[$step] Apps & Features: $($reg.DisplayName) $($reg.DisplayVersion) / $($reg.Publisher) / $($reg.InstallLocation)"
            if ($reg.DisplayVersion -ne $v) { Write-Error "[$step] DisplayVersion $($reg.DisplayVersion) statt $v."; exit 1 }
            $count = @(Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq "RedScan" }).Count
            if ($count -ne 1) { Write-Error "[$step] $count RedScan-Einträge unter Apps & Features (erwartet: 1)."; exit 1 }
            $target = (New-Object -ComObject WScript.Shell).CreateShortcut($startLnk).TargetPath
            if ($target -ne $exe) { Write-Error "[$step] Startmenü-Verknüpfung zeigt auf '$target'."; exit 1 }
          }
          function Start-Installed {
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList "--no-dialogs" -PassThru
            $null = $p.Handle
            Start-Sleep -Seconds 10
            if ($p.HasExited) { Get-Content $log -ErrorAction SilentlyContinue; Write-Error ("Installierte App hat sich beendet. ExitCode: 0x{0:X8}" -f $p.ExitCode); exit 1 }
            if (-not (Select-String -Path $log -Pattern "Fenster-Icon gesetzt" -Quiet)) { Get-Content $log -ErrorAction SilentlyContinue; Write-Error "Installierte App: Fenster-Icon nicht gesetzt (Assets fehlen?)."; exit 1 }
            return $p
          }

          # 1) Erstinstallation
          if (Test-Path $dir) { Write-Error "$dir existiert schon vor der Installation."; exit 1 }
          Invoke-Setup "install.log"
          Test-Installed "Installation"
          $p = Start-Installed
          Write-Host "Installierte App läuft (PID $($p.Id))."

          # 2) Update über die bestehende Installation, während die App läuft
          New-Item -ItemType File (Join-Path $dir "veraltet.dll") -Force | Out-Null
          Invoke-Setup "update.log"
          Test-Installed "Update"
          if (Test-Path (Join-Path $dir "veraltet.dll")) { Write-Error "Veraltete Datei der Vorversion wurde beim Update nicht entfernt."; exit 1 }
          $p.Refresh()
          if (-not $p.HasExited) { Stop-Process $p -Force; Write-Host "Hinweis: Laufende App wurde vom Setup nicht geschlossen (Datei war trotzdem ersetzbar)." }
          else { Write-Host "Laufende App wurde vom Setup für das Update geschlossen." }
          $p = Start-Installed
          Stop-Process $p -Force
          Start-Sleep -Seconds 2

          # 3) Deinstallation über den Uninstaller aus Apps & Features
          $uninst = (Get-ItemProperty $regKey).UninstallString.Trim('"')
          $u = Start-Process -FilePath $uninst -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=`"$PWD\smoke\uninstall.log`"" -Wait -PassThru
          # Der Uninstaller läuft als Kopie aus %TEMP% weiter – auf Ordner und Registry-Eintrag warten
          for ($i = 0; $i -lt 30 -and ((Test-Path $dir) -or (Test-Path $regKey)); $i++) { Start-Sleep -Seconds 2 }
          Write-Host "Uninstaller ExitCode: $($u.ExitCode)"
          foreach ($f in @($exe, $startLnk, $deskLnk)) { if (Test-Path $f) { Write-Error "Nach der Deinstallation noch vorhanden: $f"; exit 1 } }
          if (Test-Path $regKey) { Write-Error "Eintrag unter Apps & Features nach der Deinstallation noch vorhanden."; exit 1 }
          if (Test-Path $dir) { Get-ChildItem $dir -Recurse | Select-Object FullName | Out-Host; Write-Error "$dir wurde nicht entfernt."; exit 1 }
          Write-Host "Installertest bestanden: Installation, Start, Update und Deinstallation funktionieren."
      - name: Starttest-Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Starttest
          path: smoke
          if-no-files-found: ignore
      - name: Artefakt hochladen (Installer)
        uses: actions/upload-artifact@v4
        with:
          name: RedScan-Setup-${{ steps.version.outputs.version }}
          path: ${{ steps.setup.outputs.exe }}
      - name: Artefakt hochladen (portable ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: RedScan-Windows
          path: ${{ steps.pack.outputs.zip }}
      - name: Release veröffentlichen (bei Tag)
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.setup.outputs.exe }}
            ${{ steps.pack.outputs.zip }}
          name: RedScan für Windows ${{ github.ref_name }}
          body: |
            Windows-Version von RedScan (C#/.NET, WinUI). Von GitHub Actions auf echtem Windows gebaut und getestet.

            **Installation:** `RedScan-Setup-${{ steps.version.outputs.version }}.exe` herunterladen und ausführen.
            Der Installer legt RedScan unter `C:\Program Files\RedScan` ab, erstellt einen Startmenü-Eintrag
            (optional eine Desktop-Verknüpfung) und trägt die App unter „Apps & Features“ ein (dort auch deinstallierbar).
            Eine ältere Installation wird dabei automatisch aktualisiert. Die App ist self-contained (kein .NET nötig).
            Installer und App sind nicht signiert: Zeigt SmartScreen eine Warnung, „Weitere Informationen → Trotzdem ausführen“ wählen.

            Ohne Installation: `RedScan-Windows.zip` entpacken und `RedScan.exe` starten (portable).

            Die macOS-Version findest du in den übrigen Releases (Tags `v*`).
            Scanne nur Netzwerke, für die du eine Erlaubnis hast.
